<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCode · Профиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: #1c1c1e;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .profile-header {
            padding: 20px 24px 16px;
            background: #1c1c1e;
            border-bottom: 1px solid #2c2c2e;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #4f8cff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }
        .back-btn:active {
            transform: scale(0.9);
        }
        .profile-header h1 {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
        }
        .profile-content {
            flex: 1;
            overflow-y: auto;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f8cff, #6c5ce7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .profile-name {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .profile-email {
            color: #8e8e93;
            font-size: 15px;
            margin-bottom: 24px;
        }
        .profile-status {
            color: #34c759;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 32px;
            background: #2c2c2e;
            padding: 4px 16px;
            border-radius: 20px;
        }
        .profile-field {
            width: 100%;
            margin-bottom: 16px;
        }
        .profile-field label {
            color: #8e8e93;
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }
        .profile-field input,
        .profile-field textarea {
            width: 100%;
            padding: 14px 18px;
            background: #2c2c2e;
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            transition: 0.3s;
        }
        .profile-field input:focus,
        .profile-field textarea:focus {
            outline: none;
            background: #3a3a3c;
        }
        .profile-field textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        .btn-save {
            width: 100%;
            padding: 16px;
            background: #4f8cff;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .btn-save:active {
            transform: scale(0.96);
        }
        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-danger {
            width: 100%;
            padding: 16px;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
        }
        .btn-danger:active {
            transform: scale(0.96);
        }
        .profile-success {
            color: #34c759;
            font-size: 14px;
            text-align: center;
            min-height: 24px;
            margin-bottom: 8px;
        }
        .profile-error {
            color: #ff4757;
            font-size: 14px;
            text-align: center;
            min-height: 24px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Шапка -->
        <div class="profile-header">
            <button class="back-btn" id="backBtn">‹</button>
            <h1>Профиль</h1>
        </div>

        <!-- Содержание -->
        <div class="profile-content">
            <div class="profile-avatar" id="profileAvatar">?</div>
            <div class="profile-name" id="profileName">Загрузка...</div>
            <div class="profile-email" id="profileEmail">...</div>
            <div class="profile-status" id="profileStatus">🟢 онлайн</div>

            <div id="profileSuccess" class="profile-success"></div>
            <div id="profileError" class="profile-error"></div>

            <div class="profile-field">
                <label>Отображаемое имя</label>
                <input type="text" id="displayNameInput" placeholder="Ваше имя">
            </div>

            <div class="profile-field">
                <label>О себе</label>
                <textarea id="bioInput" placeholder="Расскажите о себе..."></textarea>
            </div>

            <button class="btn-save" id="saveBtn">💾 Сохранить</button>
            <button class="btn-danger" id="deleteAccountBtn">🗑 Удалить аккаунт</button>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js">
    </script>

    <script>
        // ============================================
        // FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyCEi-fbD7oAwFgWuViRqPYwnlD1FtszaR8",
            authDomain: "vibecode-messager.firebaseapp.com",
            projectId: "vibecode-messager",
            storageBucket: "vibecode-messager.firebasestorage.app",
            messagingSenderId: "280825499576",
            appId: "1:280825499576:web:e84a68f1e9d9255f21094d",
            measurementId: "G-39CT6S60ST"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================
        // DOM
        // ============================================
        const backBtn = document.getElementById('backBtn');
        const profileAvatar = document.getElementById('profileAvatar');
        const profileName = document.getElementById('profileName');
        const profileEmail = document.getElementById('profileEmail');
        const profileStatus = document.getElementById('profileStatus');
        const displayNameInput = document.getElementById('displayNameInput');
        const bioInput = document.getElementById('bioInput');
        const saveBtn = document.getElementById('saveBtn');
        const deleteAccountBtn = document.getElementById('deleteAccountBtn');
        const profileSuccess = document.getElementById('profileSuccess');
        const profileError = document.getElementById('profileError');

        let currentUser = null;
        let userData = null;

        // ============================================
        // ПРОВЕРКА АВТОРИЗАЦИИ
        // ============================================
        auth.onAuthStateChanged(async user => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            await loadProfile();
        });

        // ============================================
        // ЗАГРУЗКА ПРОФИЛЯ
        // ============================================
        async function loadProfile() {
            try {
                const doc = await db.collection('users').doc(currentUser.uid).get();
                if (doc.exists) {
                    userData = doc.data();
                    profileAvatar.textContent = userData.displayName?.charAt(0).toUpperCase() || '?';
                    profileName.textContent = userData.displayName || 'Аноним';
                    profileEmail.textContent = currentUser.email || '...';
                    profileStatus.textContent = userData.status === 'онлайн' ? '🟢 онлайн' : '⚪ офлайн';
                    displayNameInput.value = userData.displayName || '';
                    bioInput.value = userData.bio || '';
                }
            } catch (err) {
                profileError.textContent = 'Ошибка загрузки: ' + err.message;
            }
        }

        // ============================================
        // СОХРАНЕНИЕ
        // ============================================
        saveBtn.addEventListener('click', async () => {
            const displayName = displayNameInput.value.trim();
            const bio = bioInput.value.trim();

            if (!displayName) {
                profileError.textContent = 'Имя не может быть пустым';
                return;
            }

            profileError.textContent = '';
            profileSuccess.textContent = '';
            saveBtn.disabled = true;
            saveBtn.textContent = '⏳';

            try {
                await db.collection('users').doc(currentUser.uid).update({
                    displayName: displayName,
                    bio: bio
                });
                profileSuccess.textContent = '✅ Профиль обновлён!';
                profileName.textContent = displayName;
                profileAvatar.textContent = displayName.charAt(0).toUpperCase();
            } catch (err) {
                profileError.textContent = 'Ошибка: ' + err.message;
            }

            saveBtn.disabled = false;
            saveBtn.textContent = '💾 Сохранить';
        });

        // ============================================
        // УДАЛЕНИЕ АККАУНТА
        // ============================================
        deleteAccountBtn.addEventListener('click', async () => {
            if (!confirm('Вы уверены? Это действие необратимо!')) return;
            if (!confirm('Все ваши сообщения будут удалены. Продолжить?')) return;

            try {
                // Удаляем все сообщения пользователя
                const msgs = await db.collection('messages')
                    .where('sender', '==', currentUser.uid)
                    .get();

                const batch = db.batch();
                msgs.docs.forEach(doc => {
                    batch.delete(doc.ref);
                });
                await batch.commit();

                // Удаляем данные пользователя
                await db.collection('users').doc(currentUser.uid).delete();

                // Удаляем аккаунт Firebase
                await currentUser.delete();

                window.location.href = 'index.html';
            } catch (err) {
                profileError.textContent = 'Ошибка: ' + err.message;
            }
        });

        // ============================================
        // НАЗАД
        // ============================================
        backBtn.addEventListener('click', () => {
            window.location.href = 'chats.html';
        });

        // ============================================
        // СЛЕЖЕНИЕ ЗА СТАТУСОМ
        // ============================================
        db.collection('users').doc(auth.currentUser?.uid || '')
            .onSnapshot((doc) => {
                if (doc.exists && currentUser) {
                    const data = doc.data();
                    profileStatus.textContent = data.status === 'онлайн' ? '🟢 онлайн' : '⚪ офлайн';
                }
            });
    </script>

</body>
</html>
