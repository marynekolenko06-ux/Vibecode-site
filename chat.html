<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCode · Чат</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: #0f0f11;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            position: relative;
        }
        .chat-header {
            padding: 16px 20px;
            background: #1c1c1e;
            border-bottom: 1px solid #2c2c2e;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .back-btn {
            background: none;
            border: none;
            color: #4f8cff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }
        .back-btn:active {
            transform: scale(0.9);
        }
        .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #3a3a3c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
        }
        .chat-header .avatar.online {
            border: 2px solid #34c759;
        }
        .chat-header .info {
            flex: 1;
        }
        .chat-header .info .name {
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }
        .chat-header .info .status {
            color: #8e8e93;
            font-size: 13px;
        }
        .chat-header .info .status.online {
            color: #34c759;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
        }
