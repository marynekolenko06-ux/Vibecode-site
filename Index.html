<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCode · Вход</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 24px;
        }
        .auth-card {
            background: #1c1c1e;
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .auth-logo {
            font-size: 52px;
            text-align: center;
            margin-bottom: 4px;
        }
        .auth-card h1 {
            color: #fff;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
        }
        .auth-card p {
            color: #8e8e93;
            text-align: center;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            color: #8e8e93;
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: #2c2c2e;
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            transition: 0.3s;
        }
        .form-group input:focus {
            outline: none;
            background: #3a3a3c;
            transform: scale(1.01);
        }
        .form-group input::placeholder {
            color: #6c6c70;
        }
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: #4f8cff;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-google {
            width: 100%;
            padding: 16px;
            background: #fff;
            color: #1c1c1e;
            border: 1px solid #3a3a3c;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-google:active {
            transform: scale(0.96);
        }
        .btn-google img {
            width: 20px;
            height: 20px;
        }
        .auth-divider {
            text-align: center;
            color: #6c6c70;
            font-size: 13px;
            margin: 20px 0;
            position: relative;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: #2c2c2e;
        }
        .auth-divider::before {
            left: 0;
        }
        .auth-divider::after {
            right: 0;
        }
        .auth-switch {
            color: #8e8e93;
            text-align: center;
            font-size: 15px;
            margin-top: 20px;
        }
        .auth-switch a {
            color: #4f8cff;
            font-weight: 600;
            cursor: pointer;
        }
        .auth-error {
            color: #ff4757;
            font-size: 14px;
            text-align: center;
            min-height: 24px;
            margin-bottom: 12px;
        }
        .auth-version {
            text-align: center;
            color: #4a4a4d;
            font-size: 12px;
            margin-top: 20px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">⚡</div>
            <h1>VibeCode</h1>
            <p>Защищённый мессенджер</p>

            <div id="authError" class="auth-error"></div>

            <form id="authForm" autocomplete="off">
                <div class="form-group">
                    <label>Электронная почта</label>
                    <input type="email" id="emailInput" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="passInput" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" id="authBtn" class="btn-primary">Войти</button>
            </form>

            <div class="auth-divider">или</div>

            <button id="googleBtn" class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Войти через Google
            </button>

            <p class="auth-switch">
                <span id="toggleText">Нет аккаунта?</span>
                <a id="toggleLink">Создать</a>
            </p>

            <p class="auth-version">🔒 HTTPS · Защищено</p>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js">
    </script>

    <script>
        // ============================================
        // FIREBASE КОНФИГ
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyCEi-fbD7oAwFgWuViRqPYwnlD1FtszaR8",
            authDomain: "vibecode-messager.firebaseapp.com",
            projectId: "vibecode-messager",
            storageBucket: "vibecode-messager.firebasestorage.app",
            messagingSenderId: "280825499576",
            appId: "1:280825499576:web:e84a68f1e9d9255f21094d",
            measurementId: "G-39CT6S60ST"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================
        // DOM
        // ============================================
        const authForm = document.getElementById('authForm');
        const authBtn = document.getElementById('authBtn');
        const emailInput = document.getElementById('emailInput');
        const passInput = document.getElementById('passInput');
        const authError = document.getElementById('authError');
        const toggleLink = document.getElementById('toggleLink');
        const toggleText = document.getElementById('toggleText');
        const googleBtn = document.getElementById('googleBtn');

        let isLoginMode = true;

        // ============================================
        // ПЕРЕКЛЮЧЕНИЕ
        // ============================================
        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            toggleText.textContent = isLoginMode ? 'Нет аккаунта?' : 'Уже есть аккаунт?';
            toggleLink.textContent = isLoginMode ? 'Создать' : 'Войти';
            authBtn.textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
            authError.textContent = '';
        });

        // ============================================
        // АВТОРИЗАЦИЯ
        // ============================================
        async function handleAuth(e) {
            e.preventDefault();
            const email = emailInput.value.trim();
            const pass = passInput.value.trim();

            if (!email || pass.length < 6) {
                authError.textContent = 'Введите почту и пароль (мин. 6 символов)';
                return;
            }

            authError.textContent = '';
            authBtn.disabled = true;
            authBtn.textContent = '⏳';

            try {
                let userCredential;
                if (isLoginMode) {
                    userCredential = await auth.signInWithEmailAndPassword(email, pass);
                } else {
                    userCredential = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.collection('users').doc(userCredential.user.uid).set({
                        email: email,
                        displayName: email.split('@')[0],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        status: 'онлайн',
                        bio: ''
                    });
                }
                window.location.href = 'chats.html';
            } catch (err) {
                authError.textContent = err.message;
                authBtn.disabled = false;
                authBtn.textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
            }
        }

        authForm.addEventListener('submit', handleAuth);

        // ============================================
        // GOOGLE
        // ============================================
        googleBtn.addEventListener('click', async () => {
            googleBtn.disabled = true;
            googleBtn.innerHTML = '⏳';

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const userDoc = await db.collection('users').doc(result.user.uid).get();
                if (!userDoc.exists) {
                    await db.collection('users').doc(result.user.uid).set({
                        email: result.user.email,
                        displayName: result.user.displayName || result.user.email.split('@')[0],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        status: 'онлайн',
                        bio: ''
                    });
                }
                window.location.href = 'chats.html';
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user') {
                    authError.textContent = err.message;
                }
                googleBtn.disabled = false;
                googleBtn.innerHTML =
                    '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"> Войти через Google';
            }
        });

        // ============================================
        // ПРОВЕРКА: если уже залогинен
        // ============================================
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'chats.html';
            }
        });
    </script>

</body>
</html>
